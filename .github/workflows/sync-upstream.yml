name: Sync Upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.sync.outputs.changed }}

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/anomalyco/models.dev.git
          git fetch upstream dev

      - name: Sync upstream into dev
        id: sync
        run: |
          set -euo pipefail

          # Sync the upstream snapshot into dev without importing upstream
          # workflow commits. Fork-owned workflows stay untouched.
          git diff --binary HEAD upstream/dev -- . ':(exclude).github/workflows/**' > /tmp/upstream.patch

          if [ ! -s /tmp/upstream.patch ]; then
            echo "dev is already in sync with upstream (excluding workflows)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git apply --index --3way /tmp/upstream.patch

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$conflicts" ]; then
            echo "::error::Upstream sync conflict detected. dev was not modified."
            {
              echo "## Upstream sync failed"
              echo
              echo "Conflicts were detected while applying the latest upstream snapshot to `dev`."
              echo
              echo "Files under `.github/workflows` are intentionally excluded and remain fork-owned."
              echo
              echo "### Conflicting files"
              echo '~~~'
              echo "$conflicts"
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"

            git reset --hard HEAD
            exit 1
          fi

          upstream_sha="$(git rev-parse upstream/dev)"
          git commit -m "chore(sync): sync upstream at ${upstream_sha:0:12}"
          git push origin dev
          echo "changed=true" >> "$GITHUB_OUTPUT"

          {
            echo "## Upstream sync succeeded"
            echo
            echo "Synced `anomalyco/models.dev:dev` at `$upstream_sha` into `dev`."
            echo
            echo "Fork-owned files under `.github/workflows` were preserved."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
