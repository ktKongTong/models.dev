name: Sync Upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.merge-dev.outputs.changed }}

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch branches
        run: |
          git remote add upstream https://github.com/anomalyco/models.dev.git
          git fetch upstream dev
          git fetch origin dev upstream-sync

      - name: Sync upstream into upstream-sync
        run: |
          set -euo pipefail

          git checkout -B upstream-sync origin/upstream-sync

          if git merge-base --is-ancestor upstream/dev upstream-sync; then
            echo "upstream-sync already contains upstream/dev."
            exit 0
          fi

          set +e
          git merge --no-commit --no-ff upstream/dev
          merge_status=$?
          set -e

          # GitHub's GITHUB_TOKEN cannot update workflow files imported from
          # another branch. Keep this fork's workflow subtree unchanged on
          # upstream-sync while preserving upstream commit ancestry.
          git restore --source=HEAD --staged --worktree -- .github/workflows || true

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$conflicts" ]; then
            echo "::error::Conflict while syncing upstream into upstream-sync."
            {
              echo "## upstream-sync failed"
              echo
              echo "### Conflicting files"
              echo '~~~'
              echo "$conflicts"
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
            git merge --abort || true
            exit 1
          fi

          if [ "$merge_status" -ne 0 ]; then
            echo "Workflow-only conflicts were resolved by keeping fork workflows."
          fi

          # Create the merge commit even when upstream only changed workflows,
          # so upstream/dev remains recorded as an ancestor of upstream-sync.
          git commit --allow-empty --no-edit
          git push origin upstream-sync

      - name: Merge upstream-sync into dev
        id: merge-dev
        run: |
          set -euo pipefail

          git fetch origin dev upstream-sync
          git checkout -B dev origin/dev

          if git merge-base --is-ancestor origin/upstream-sync dev; then
            echo "dev already contains upstream-sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          git merge --no-commit --no-ff origin/upstream-sync
          merge_status=$?
          set -e

          # dev owns its Actions workflows.
          git restore --source=HEAD --staged --worktree -- .github/workflows || true

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$conflicts" ]; then
            echo "::error::Conflict while merging upstream-sync into dev."
            {
              echo "## Upstream merge requires resolution"
              echo
              echo "`upstream-sync` was updated successfully, but `dev` was left unchanged."
              echo
              echo "### Conflicting files"
              echo '~~~'
              echo "$conflicts"
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
            git merge --abort || true
            exit 1
          fi

          if [ "$merge_status" -ne 0 ]; then
            echo "Workflow-only conflicts were resolved by keeping dev workflows."
          fi

          git commit --allow-empty --no-edit
          git push origin dev
          echo "changed=true" >> "$GITHUB_OUTPUT"

          {
            echo "## Upstream sync succeeded"
            echo
            echo "`anomalyco/models.dev:dev` → `upstream-sync` → `dev`."
            echo
            echo "Upstream ancestry is preserved; fork workflows remain local."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
