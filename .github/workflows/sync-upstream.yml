name: Sync Upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.merge.outputs.changed }}

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/anomalyco/models.dev.git
          git fetch upstream dev

      - name: Merge upstream into dev
        id: merge
        run: |
          set -euo pipefail

          git checkout dev

          if git merge-base --is-ancestor upstream/dev dev; then
            echo "dev already contains upstream/dev; nothing to merge."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Workflows are fork-owned. Never import upstream workflow changes:
          # GITHUB_TOKEN cannot write workflow files, and our deployment/sync
          # workflows intentionally differ from upstream.
          set +e
          git merge --no-commit --no-ff upstream/dev
          merge_status=$?
          set -e

          git restore --source=HEAD --staged --worktree -- .github/workflows

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$conflicts" ]; then
            echo "::error::Upstream merge conflict detected outside .github/workflows. dev was not modified."
            {
              echo "## Upstream sync failed"
              echo
              echo "Merge conflicts were detected while merging `anomalyco/models.dev:dev` into `dev`."
              echo
              echo "Changes under `.github/workflows` are intentionally ignored because workflows are fork-owned."
              echo
              echo "### Conflicting files"
              echo '~~~'
              echo "$conflicts"
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"

            git merge --abort || true
            exit 1
          fi

          if [ "$merge_status" -ne 0 ]; then
            echo "Only fork-owned workflow conflicts were present; continuing with local workflows."
          fi

          git commit --no-edit
          git push origin dev
          echo "changed=true" >> "$GITHUB_OUTPUT"

          {
            echo "## Upstream sync succeeded"
            echo
            echo "Merged `anomalyco/models.dev:dev` into `dev`."
            echo
            echo "Upstream changes under `.github/workflows` were ignored; fork workflows were preserved."
            echo
            echo "The reusable Deploy workflow will deploy the updated `dev` branch."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
