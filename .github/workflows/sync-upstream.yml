name: Sync Upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.merge.outputs.changed }}

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/anomalyco/models.dev.git
          git fetch upstream dev
          git fetch origin upstream-sync

      - name: Mirror upstream-sync
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${SYNC_TOKEN:-}" ]; then
            echo "::error::Missing UPSTREAM_SYNC_TOKEN secret."
            exit 1
          fi

          upstream_sha="$(git rev-parse upstream/dev)"
          current_sync_sha="$(git rev-parse origin/upstream-sync)"

          if [ "$upstream_sha" = "$current_sync_sha" ]; then
            echo "upstream-sync is already current: $upstream_sha"
            exit 0
          fi

          git push \
            --force-with-lease=refs/heads/upstream-sync:"$current_sync_sha" \
            "https://x-access-token:${SYNC_TOKEN}@github.com/ktKongTong/models.dev.git" \
            upstream/dev:refs/heads/upstream-sync

          git fetch origin upstream-sync
          echo "Updated upstream-sync: $current_sync_sha -> $upstream_sha"

      - name: Merge upstream-sync into dev
        id: merge
        run: |
          set -euo pipefail

          git checkout dev

          if git merge-base --is-ancestor origin/upstream-sync dev; then
            echo "dev already contains upstream-sync; nothing to merge."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          git merge --no-commit --no-ff origin/upstream-sync
          merge_status=$?
          set -e

          # The mirror branch stays byte-for-byte identical to upstream.
          # dev keeps this fork's own workflows.
          git restore --source=HEAD --staged --worktree -- .github/workflows

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$conflicts" ]; then
            echo "::error::Upstream merge conflict detected. dev was not modified."
            {
              echo "## Upstream sync failed"
              echo
              echo "`upstream-sync` was mirrored successfully from `anomalyco/models.dev:dev`."
              echo
              echo "Merge conflicts were detected while merging `upstream-sync` into `dev`."
              echo
              echo "Fork-owned files under `.github/workflows` were preserved automatically."
              echo
              echo "### Conflicting files"
              echo '~~~'
              echo "$conflicts"
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"

            git merge --abort || true
            exit 1
          fi

          if [ "$merge_status" -ne 0 ]; then
            echo "Only fork-owned workflow conflicts were present; continuing with local workflows."
          fi

          git commit --no-edit
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/ktKongTong/models.dev.git" dev
          echo "changed=true" >> "$GITHUB_OUTPUT"

          {
            echo "## Upstream sync succeeded"
            echo
            echo "Mirrored `anomalyco/models.dev:dev` to `upstream-sync`."
            echo
            echo "Merged `upstream-sync` into `dev`, preserving fork-owned workflows."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
